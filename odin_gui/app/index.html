<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Odin 3.0</title>
<style>
/* ═══════════════════════════════════════════════════════════════
   앱 껍데기 — 화면(시장 온도·마켓 …)을 전체 크기 틀 하나에 띄운다.
   왜: Orca 내장 브라우저는 페이지 안에서 다른 로컬 파일로 넘어가는 이동(file:// → file://)을 막는다
       (링크·location 변경 모두 차단, 2026-09-15 실측). 틀(iframe) 안의 이동은 허용돼서
       사이드바 링크가 어디서 열든(내장 브라우저·Chrome·pywebview 앱 창) 똑같이 동작하게 한다.
   주소: index.html#market.html?tab=sell 처럼 틀 안의 화면을 # 뒤에 기억 → 새로고침해도 그 화면으로.
   화면 쪽 약속: 각 화면은 끝에 "odin-screen" 메시지 스크립트를 넣어 자기 위치·제목을 알린다(없어도 이동은 됨).
   ═══════════════════════════════════════════════════════════════ */
html, body { margin: 0; height: 100%; background: #17181C; overflow: hidden; }
iframe { display: block; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<iframe id="view" title="Odin 3.0 화면"></iframe>
<script>
const view = document.getElementById("view");
const DEFAULT = "market-temp.html";

/* # 뒤의 화면 이름만 받는다(같은 폴더의 .html + 쿼리). 그 밖의 값은 무시하고 기본 화면으로 */
function screenFromHash() {
  const h = decodeURIComponent(location.hash.slice(1));
  return /^[\w-]+\.html(\?[\w=&%.-]*)?$/.test(h) ? h : DEFAULT;
}

let current = screenFromHash();
view.src = current;

/* 화면이 보내는 "지금 여기" 메시지로 제목·주소를 맞춘다.
   (Chrome·앱 창은 로컬 파일끼리를 다른 출처로 봐서 틀 안을 직접 못 읽음 → 메시지 방식) */
window.addEventListener("message", e => {
  if (e.source !== view.contentWindow || !e.data || e.data.type !== "odin-screen") return;
  const here = String(e.data.screen || "");
  if (!/^[\w-]+\.html(\?[\w=&%.-]*)?$/.test(here)) return;
  document.title = String(e.data.title || "Odin 3.0").slice(0, 80);
  current = here;
  if (screenFromHash() !== here) history.replaceState(null, "", "#" + here);
});

/* 사용자가 주소창의 # 뒤를 직접 바꾼 경우 */
window.addEventListener("hashchange", () => {
  const want = screenFromHash();
  if (want !== current) { current = want; view.src = want; }
});
</script>
</body>
</html>
