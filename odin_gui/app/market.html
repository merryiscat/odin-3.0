<!-- 폰트: SUIT(본문) + IBM Plex Mono(시각 표시) — market-temp.html과 동일 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/variable/woff2/SUIT-Variable.css">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════
   마켓 — "Koyfin 문법" (DESIGN.md) · 2026-09-15 첫 화면
   - 와이어 확정안: odin_gui/screens/M1-market-buy.html(구매 목록), M2-market-sell.html(판매 관리 + 새 모델 올리기)
   - 데이터: 마켓 DB 설계 전 → 전부 예시 데이터(상단바에 표시). 구매·판매 개시는 과금 방식·법적 검토 뒤.
   ═══════════════════════════════════════════════════════════════ */
:root {
  --chrome: #17181C; --chrome-2: #26282E; --chrome-ink: #E8EAED; --chrome-muted: #9AA0A8;
  --canvas: #F4F5F7; --panel: #FFFFFF; --line: #E3E5E8;
  --ink: #191F28; --muted: #6B7684; --accent: #2F6FED;
  --up: #F04452; --down: #3182F6; --flat: #8B95A1; --hot: #E8590C;
  --live: #17A05D; --seg: #E9EBEE;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body { font-family: 'SUIT Variable', SUIT, 'Malgun Gothic', sans-serif;
       background: var(--canvas); color: var(--ink); display: flex; flex-direction: column; }
button, input, select { font-family: inherit; }

/* ── 상단바 ── */
.top { height: 48px; background: var(--chrome); color: var(--chrome-ink);
       display: flex; align-items: center; padding: 0 20px; gap: 24px; flex: none; }
.logo { font-size: 14px; font-weight: 800; letter-spacing: .35em; }
.clock { font-family: 'IBM Plex Mono', Consolas, monospace; font-size: 12px; color: var(--chrome-muted); }
.clock .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--flat); margin-right: 8px; }
.tabs { margin-left: auto; display: flex; gap: 4px; }
.tab { background: none; border: 0; padding: 6px 12px; cursor: pointer; font-size: 12px; font-weight: 500;
       color: var(--chrome-muted); border-radius: 4px; }
.tab.on { background: var(--chrome-2); color: var(--chrome-ink); font-weight: 700; }
/* 개정 번호는 화면에 안 보이게 body[data-rev]로만(2026-09-16 검수 "빼") — 검수 어긋남 확인용 */

/* ── 사이드바 (market-temp.html과 동일 구조) ── */
.wrap { flex: 1; display: flex; min-height: 0; }
.side { width: 192px; flex: none; background: var(--chrome); padding: 16px 0; overflow-y: auto; }
/* 사이드바 위계 통일(2026-09-16 사용자 지정): 제목 = 파이프라인·마켓·연구소·계좌·리서치(14px 굵게),
   소제목 = 그 아래 항목 전부(12px, 34px 들여쓰기). 접기 화살표는 묶음 제목(링크 아닌 것)에만. */
.nav-group { font-size: 14px; font-weight: 700; color: var(--chrome-muted);
             padding: 7px 20px; margin-top: 14px; cursor: pointer; }
.nav-group:first-child { margin-top: 0; }
.nav-group::after { content: "▾"; float: right; font-size: 10px; margin-top: 3px; }   /* 접기 표시(순수 기호) */
.nav-group.closed::after { content: "▸"; }
.nav.hid { display: none; }
.nav { display: block; font-size: 12px; padding: 7px 20px 7px 34px; color: var(--chrome-muted); font-weight: 400;
       text-decoration: none; cursor: default; border-left: 2px solid transparent; }
a.nav[href*=".html"] { cursor: pointer; }   /* ?tab=… 붙은 하위 메뉴도 손가락 커서 */
.nav.on { color: var(--chrome-ink); font-weight: 700; background: var(--chrome-2); border-left-color: var(--accent); }
/* 제목이면서 링크인 항목(마켓·계좌) — 묶음 제목과 같은 크기 (클래스명 top은 상단바 .top과 겹침 주의) */
.nav.solo { margin-top: 14px; font-size: 14px; font-weight: 700; padding-left: 20px; }
.main { flex: 1; min-width: 0; overflow-y: auto; padding: 16px; }

/* ── 패널 공통 ── */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.p-head { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--line); min-height: 42px; }
.p-title { font-size: 13px; font-weight: 800; letter-spacing: .02em; }
.p-sub { font-size: 11px; color: var(--muted); }
.p-body { padding: 14px; }
.sec { font-size: 10.5px; font-weight: 600; letter-spacing: .1em; color: var(--muted); text-transform: uppercase; margin: 14px 0 6px; }
.sec:first-child { margin-top: 0; }
.num { font-variant-numeric: tabular-nums; }
.c-up { color: var(--up); } .c-down { color: var(--down); } .c-flat { color: var(--flat); }
.note { font-size: 11px; color: var(--muted); }

/* 버튼·배지·입력 */
.btn { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 4px;
       padding: 6px 12px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.sm { padding: 3px 9px; font-size: 11px; }
.badge { display: inline-block; font-size: 10.5px; font-weight: 700; padding: 1px 7px; border-radius: 3px;
         border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.badge.on { background: var(--ink); border-color: var(--ink); color: #fff; }
.badge.ok { border-color: var(--ink); color: var(--ink); }
.badge.wait { border-style: dashed; }
.badge.bad { border-color: var(--ink); color: var(--ink); background: var(--seg); }
input[type=text], input[type=search], select { border: 1px solid var(--line); border-radius: 4px; padding: 6px 10px;
       font-size: 12px; color: var(--ink); background: var(--panel); width: 100%; }
input:focus, select:focus { outline: 1px solid var(--accent); border-color: var(--accent); }
label.chk { display: flex; align-items: center; gap: 7px; font-size: 12.5px; padding: 3px 0; cursor: pointer; }
label.chk input { accent-color: var(--ink); }

/* ═════ 구매 ═════ */
/* 필터 패널 제거(2026-09-15 사용자 지정 "탭으로만 구분") — 종류 탭 + 검색·정렬만 남김 */
.buy { min-width: 0; }
/* 종류 탭 — 시장 온도 · 매매리스트 · 매매모델 (필터 체크 대신, 2026-09-15 사용자 지정).
   리스트 화면과 업로드 화면이 같은 것을 쓴다 — 마켓 안에서 구분 방식이 갈리지 않게(2026-09-16 검수 "업로드도 동일한 탭구조") */
.ttabs { display: flex; border-bottom: 1px solid var(--line); margin-bottom: 12px; }
.ttabs button { background: none; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px;
                padding: 9px 16px; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; }
.ttabs button.on { color: var(--ink); font-weight: 800; border-bottom-color: var(--accent); }
.ttabs .n { font-size: 11px; font-weight: 600; color: var(--muted); margin-left: 6px; font-variant-numeric: tabular-nums; }
.toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
.toolbar .count { font-size: 12px; font-weight: 700; white-space: nowrap; }
.toolbar input { max-width: 280px; }
.toolbar select { width: auto; margin-left: auto; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.card .p-head { justify-content: space-between; }
.card .nm { font-size: 14px; font-weight: 800; }
.card .by { font-size: 11px; color: var(--muted); margin-top: 2px; line-height: 1.45; min-height: 32px; }
.card svg { display: block; margin: 10px 0 8px; }
.kpi { display: flex; gap: 20px; border-top: 1px solid var(--line); padding-top: 8px; }   /* 칸 수가 종류마다 달라 고정 3칸 격자 대신 나열 */
.kpi div { font-size: 10.5px; color: var(--muted); }
.kpi b { display: block; font-size: 14px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
.card-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }
.price { font-size: 12.5px; font-weight: 700; }
.card.base { background: transparent; border-style: dashed; }
.card .hint { font-size: 10.5px; color: var(--muted); margin-top: 6px; min-height: 14px; }
.disclaim { font-size: 11px; color: var(--muted); margin-top: 12px; }
.empty { padding: 28px 14px; font-size: 13px; color: var(--muted); }

/* ═════ 판매 ═════ */
.kpis { display: grid; grid-template-columns: repeat(5, 1fr); margin-bottom: 12px; }   /* 상태 4개 + 구매 수 */
.kpis div { padding: 10px 14px; border-right: 1px solid var(--line); font-size: 11px; color: var(--muted); }
.kpis div:last-child { border-right: 0; }
.kpis b { display: block; font-size: 20px; font-weight: 800; color: var(--ink); font-variant-numeric: tabular-nums; }
.sell { display: grid; gap: 12px; align-items: start; }   /* 검증 리포트 칸 제거(2026-09-17 검수) — 내 모델 표만 한 폭으로 */
.sell > * { min-width: 0; }
.tbl-wrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.tbl th { font-size: 11px; font-weight: 600; color: var(--muted); text-align: right; padding: 8px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 9px 14px; border-top: 1px solid var(--line); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.tbl th:nth-child(-n+2), .tbl td:nth-child(-n+2) { text-align: left; }
.tbl tr:first-child td { border-top: 0; }
.tbl tbody tr { cursor: pointer; }
.tbl tbody tr:hover td { background: var(--canvas); }
.tbl tbody tr.sel td { background: var(--seg); }
.tbl td.row-acts { display: flex; gap: 6px; justify-content: flex-end; }   /* 상세 보기 + 다운로드 */
.check { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.check td { padding: 7px 0; border-top: 1px solid var(--line); }
.check tr:first-child td { border-top: 0; }
.check td:last-child { text-align: right; }
.mono { font-family: 'IBM Plex Mono', Consolas, monospace; font-size: 11.5px; }
.row-btns { display: flex; justify-content: space-between; gap: 8px; margin-top: 14px; }

/* 올리기 */
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-bottom: 14px; }
.steps div { font-size: 11.5px; padding: 7px 8px; border-radius: 4px; background: var(--canvas); color: var(--muted); text-align: center; }
.steps div.done { color: var(--ink); }
.steps div.on { background: var(--ink); color: #fff; font-weight: 700; }
.ways { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; align-items: start; }   /* 스키마 정의서 쪽을 넓게(2026-09-17 검수) */
.way { border: 1px solid var(--line); border-radius: 4px; padding: 12px; }
.way h4 { font-size: 13px; font-weight: 800; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
/* 만들 부품은 1단계 맨 위에서 한 번만 고른다(2026-09-17 검수) — 규격·프롬프트·올릴 모듈이 모두 이걸 따른다 */
.kindrow { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.kindrow select { width: auto; }
/* 스키마 정의서 — 보내는 값 이름·예시 값·설명 세 칸(2026-09-17 검수) */
.schema-wrap { border: 1px solid var(--line); border-radius: 4px; max-height: 380px; overflow: auto; }   /* 설명을 풀어 쓰면서 줄이 높아져 조금 키움(2026-09-17) */
.schema { width: 100%; border-collapse: collapse; font-size: 11px; line-height: 1.5; }
.schema th { position: sticky; top: 0; background: var(--panel); text-align: left; font-size: 10.5px; font-weight: 600;
             color: var(--muted); padding: 6px 9px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.schema td { text-align: left; padding: 6px 9px; border-top: 1px solid var(--line); vertical-align: top; overflow-wrap: anywhere; }
.schema td:nth-child(-n+2) { font-family: 'IBM Plex Mono', Consolas, monospace; }
.schema td:nth-child(3) { color: var(--muted); }
.schema tr.grp td { background: var(--canvas); font-weight: 700; color: var(--ink); font-size: 10.5px; }
.drop { display: block; border: 1px dashed var(--muted); border-radius: 4px; padding: 18px 10px; text-align: center; font-size: 12px; color: var(--muted); margin-top: 8px; cursor: pointer; }
.drop b { display: block; font-size: 12.5px; font-weight: 700; color: var(--ink); margin-bottom: 3px; }
.drop.has { border-style: solid; border-color: var(--ink); }
.drop.over { border-color: var(--accent); background: var(--canvas); }
/* LLM에게 줄 규격·프롬프트(2026-09-17 검수) — 그대로 복사해 쓰는 칸이라 고정폭 글꼴 */
.codebox { font-family: 'IBM Plex Mono', Consolas, monospace; font-size: 11px; line-height: 1.55;
           background: var(--canvas); border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px;
           max-height: 132px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; }
textarea.codebox { width: 100%; height: 132px; max-height: none; resize: vertical; color: var(--ink); }
.sec.pickrow { display: flex; align-items: center; gap: 8px; }
.sec.pickrow select { width: auto; text-transform: none; letter-spacing: 0; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.two > * { min-width: 0; }
.fld { margin-bottom: 10px; }
.fld .lb { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
.fld .ro { font-size: 12.5px; }
.bar { height: 6px; background: var(--seg); border-radius: 3px; overflow: hidden; margin: 6px 0 10px; }
.bar i { display: block; height: 100%; width: 0; background: var(--ink); transition: width .3s; }
.preview-cap { font-size: 10.5px; color: var(--muted); margin-top: 6px; }
.blank b { color: var(--flat); }

/* 새 창(모달) — 모델 상세, 새 모델 올리기(2026-09-16·17 검수) */
.modal-back { position: fixed; inset: 0; background: rgba(23, 24, 28, .45); z-index: 50;
              display: flex; align-items: center; justify-content: center; padding: 24px; }
.modal { width: min(940px, 100%); max-height: 86vh; overflow-y: auto;
         box-shadow: 0 12px 40px rgba(0, 0, 0, .25); }

@media (max-width: 1080px) {
  .ways, .two { grid-template-columns: 1fr; }
  .kpis { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const sign = v => (v > 0 ? "+" : "") + v.toFixed(1);
const cls = v => v > 0.05 ? "c-up" : v < -0.05 ? "c-down" : "c-flat";

/* 예시 자산 곡선 — 모델마다 고정된 모양(seed) */
function curve(seed, drift, W = 220, H = 44) {
  let x = seed * 9301 + 49297, v = 0;
  const pts = [];
  for (let i = 0; i < 40; i++) {
    x = (x * 9301 + 49297) % 233280;
    v += (x / 233280 - 0.5) * 2 + drift / 40;
    pts.push(v);
  }
  const min = Math.min(...pts), max = Math.max(...pts), span = (max - min) || 1;
  const xy = pts.map((p, i) => `${(i / 39 * W).toFixed(1)},${(H - 3 - (p - min) / span * (H - 6)).toFixed(1)}`).join(" ");
  const col = pts[39] >= pts[0] ? "var(--up)" : "var(--down)";
  return `<svg width="100%" height="${H}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <polyline points="${xy}" fill="none" stroke="${col}" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>`;
}

function kpiFmt(m, i, v) {
  if (m.type === "state") return i === 0 ? `${v}%` : `${v}`;
  if (m.type === "pick") return i === 1 ? `${v}` : `<span class="${cls(v)}">${sign(v)}%p</span>`;
  return `<span class="${cls(v)}">${sign(v)}%</span>`;
}

function kpiCells(m) {
  const L = KPI_LABELS[m.type];
  return `<div class="kpi">${L.map((label, i) =>
    `<div><b>${kpiFmt(m, i, m.k[i])}</b>${label}</div>`).join("")}</div>`;
}

function ioTable(rows, heads) {
  return `<div class="tbl-wrap"><table class="tbl">
    <thead><tr>${heads.map(h => `<th style="text-align:left">${h}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(r => `<tr>${r.slice(0, heads.length).map((c, i) =>
      `<td style="text-align:left;white-space:normal;overflow-wrap:anywhere${i ? ";color:var(--muted)" : ""}">${c}</td>`).join("")}</tr>`).join("")}</tbody>
  </table></div>`;
}

function detailHtml(m) {
  const io = IO_SPEC[m.type];
  const buy = m.base ? "" : `<button class="btn sm pri" data-buy="${m.id}">다운로드</button>`;
  return `<div class="modal-back" data-modal-back><div class="modal panel">
    <div class="p-head"><span class="p-title">모델 상세 — ${esc(m.name)}</span>
      <span class="p-sub">${esc(m.seller)} · v${m.ver} · ${TYPES[m.type]}${m.base ? " · 비교용(구매 불가)" : ""}</span>
      <button class="btn sm" style="margin-left:auto" data-detail-close>닫기</button></div>
    <div class="p-body">
      <div class="two">
        <div>
          <div class="sec">입력 — 무엇을 읽나</div>
          ${ioTable(io.in, ["파라미터", "출처(표)", "주기"])}
        </div>
        <div>
          <div class="sec">출력 — 무엇을 내보내나</div>
          ${ioTable(io.out, ["칸", "뜻", "값"])}
          <div class="note" style="margin-top:8px">${io.outNote}</div>
        </div>
      </div>
      <div class="row-btns"><span></span>${buy}</div>
      <div class="note">${BUY.hint[m.id] || ""}</div>
    </div>
  </div></div>`;
}

function renderBuy() {
  const list = buyList();
  const sel = BUY.sel && MODELS.find(m => m.id === BUY.sel && m.type === BUY.type);   // 다른 종류 탭이면 상세를 접는다
  $("#main").innerHTML = `<div class="buy">
    <div class="ttabs">${Object.entries(TYPES).map(([k, v]) =>
      `<button data-ttab="${k}" class="${BUY.type === k ? "on" : ""}">${v}<span class="n">${buyList(k).filter(m => !m.base).length}</span></button>`).join("")}</div>
    <div class="toolbar">
      <span class="count">${list.filter(m => !m.base).length}개 모델</span>
      <input type="search" id="q" placeholder="모델 이름 · 제작자 검색" value="${esc(BUY.q)}">
    </div>
    ${list.length ? listHtml(list) : `<div class="panel empty">조건에 맞는 모델이 없습니다.</div>`}
    ${BUY.hint[BUY.last] ? `<div class="disclaim">${esc(BUY.last ? (MODELS.find(m => m.id === BUY.last) || {}).name || "" : "")} — ${BUY.hint[BUY.last]}</div>` : ""}
    ${sel ? detailHtml(sel) : ""}
  </div>`;
}
$("#main").addEventListener("input", e => {
  if (e.target.id === "q") {
    BUY.q = e.target.value;
    const pos = e.target.selectionStart;
    renderBuy();
    const q = $("#q"); q.focus(); q.setSelectionRange(pos, pos);
  }
});

/* ═══════════ 판매 ═══════════ */
const SELL = { type: "state", sel: "s2", upload: null, timer: null };   /* type = 종류 탭(리스트 화면과 동일). 상태 필터는 제거(2026-09-17 검수) — 개수는 위 요약 칸이 보여준다 */

/* 내 모델을 종류 탭으로 먼저 거른다 — 리스트 화면의 buyList()와 같은 자리 */
function myList(type = SELL.type) { return MY.filter(r => r.type === type); }

function statusBadge(s) { const [t, c] = STATUS[s]; return `<span class="badge ${c}">${t}</span>`; }

function renderSell() {
  const rows = myList();
  const cnt = s => rows.filter(r => r.status === s).length;
  const L = KPI_LABELS[SELL.type];   /* 숫자 칸은 리스트 화면과 같은 것으로 — 검증 전이면 빈칸(2026-09-17 검수) */
  $("#main").innerHTML = `
    <div class="ttabs">${Object.entries(TYPES).map(([k, v]) =>
      `<button data-stab="${k}" class="${SELL.type === k ? "on" : ""}">${v}<span class="n">${myList(k).length}</span></button>`).join("")}</div>
    <div class="panel kpis">
      <div><b>${cnt("sale")}</b>판매 중</div><div><b>${cnt("passed")}</b>검증 통과</div>
      <div><b>${cnt("verify")}</b>검증 중</div><div><b>${cnt("reject")}</b>반려</div>
      <div><b>${rows.reduce((a, r) => a + (r.buys || 0), 0)}</b>이번 달 구매 수</div>
    </div>
    <div class="sell">
      <div class="panel">
        <div class="p-head"><span class="p-title">내 모델</span>
          <button class="btn pri" style="margin-left:auto" data-act="upload">새 모델 올리기</button>
        </div>
        <div class="tbl-wrap"><table class="tbl">
          <thead><tr><th>모델</th><th>버전</th><th>상태</th>${L.map(x => `<th>${x}</th>`).join("")}<th>구매 수</th><th>가격</th></tr></thead>
          <tbody>${rows.map(r => `<tr data-row="${r.id}" class="${SELL.sel === r.id ? "sel" : ""}">
            <td><b>${esc(r.name)}</b></td><td>v${r.ver}</td><td>${statusBadge(r.status)}</td>
            ${L.map((_, i) => `<td>${r.k ? kpiFmt(r, i, r.k[i]) : "—"}</td>`).join("")}
            <td>${r.buys == null ? "—" : r.buys}</td><td>${r.status === "sale" || r.status === "passed" ? "유료" : "—"}</td></tr>`).join("")}</tbody>
        </table></div>
        ${rows.length ? "" : `<div class="empty">${TYPES[SELL.type]} 종류로 올린 모델이 없습니다.</div>`}
      </div>
    </div>
    ${SELL.upload ? uploadHtml() : ""}`;
}

/* ── 새 모델 올리기 — 화면을 갈아끼우지 않고 새 창(모달)으로(2026-09-17 검수) ── */
function startUpload() {
  SELL.upload = { step: 1, type: SELL.type, name: "", file: null, copied: false, desc: "", price: "", progress: 0, rowId: null };
  renderSell();
}

/* 검증을 통과한 예시 성적 — 올리기 미리보기 카드와 내 모델 표가 같은 값을 쓴다 */
const PASS_K = { trade: [12.1, -8.4], pick: [5.3, 18], state: [58, 498] };

/* LLM에게 그대로 넘기는 규격 — IO_SPEC 표를 글로 편 것(화면의 상세 표와 같은 내용) */
function specText(type) {
  const io = IO_SPEC[type];
  return [`# ${TYPES[type]} 모듈 규격 v1`, "", "입력 — 읽는 값"]
    .concat(io.in.map(r => `  ${r[0]}\n      ${r[1]} · ${r[2]}\n      예: ${r[3]}`))
    .concat(["", "출력 — 내보낼 값"])
    .concat(io.out.map(r => `  ${r[0]}\n      ${r[1]} = ${r[2]}\n      예: ${r[3]}`))
    .concat(["", `* ${io.outNote}`]).join("\n");
}

/* 화면용 스키마 정의서 — 보내는 값 이름 · 실제 값 예시 · 설명 */
function schemaTable(type) {
  const io = IO_SPEC[type];
  const rows = g => g.map(r => `<tr><td>${esc(r[0])}</td><td>${esc(r[3])}</td><td>${esc(r[1])} · ${esc(r[2])}</td></tr>`).join("");
  return `<div class="schema-wrap"><table class="schema">
    <thead><tr><th>값 이름</th><th>실제 값 예시</th><th>설명</th></tr></thead>
    <tbody>
      <tr class="grp"><td colspan="3">읽는 값 (입력)</td></tr>
      ${rows(io.in)}
      <tr class="grp"><td colspan="3">내보낼 값 (출력)</td></tr>
      ${rows(io.out)}
    </tbody></table></div>`;
}

/* 규격을 붙여 그대로 LLM에게 보내는 지시문 */
function promptText(type) {
  return [
    `오딘 마켓에 올릴 "${TYPES[type]}" 모듈을 만들어 줘.`,
    "아래 규격을 그대로 지켜야 검증을 통과한다.",
    "",
    specText(type),
    "",
    "지켜야 할 것",
    "  - 증권사 키를 읽지 않는다",
    "  - 바깥으로 아무것도 보내지 않는다",
    "  - 직접 주문하지 않는다 (주문 의도만 내보낸다)",
    "  - 미래 데이터를 보지 않는다 (판단 시각 이후 값 금지)",
    "  - 이미 쓴 줄은 고치거나 지우지 않는다 (쌓기만)",
  ].concat((IO_SPEC[type].rules || []).map(r => `  - ${r}`)).concat([
    "",
    "만든 뒤에는 오딘 MCP 도구로 과거 시세 2년을 받아 백테스트를 돌려 보고,",
    "비교용 기준선을 넘으면 모듈 파일을 내게 줘 — 마켓에 올리는 것은 사람이 한다.",
  ]).join("\n");
}

function previewCard(u, passed) {
  const m = { id: "pv", name: u.name || "이름", type: u.type, seller: "나", ver: 1, desc: u.desc || "한 줄 설명", free: false, k: PASS_K[u.type], vs: 5.3, seed: 29 };
  const head = `<div class="p-head"><span class="badge">${TYPES[m.type]}</span><span class="badge ${passed ? "ok" : "wait"}">${passed ? "검증 통과" : "검증 전"}</span></div>`;
  const body = passed
    ? `${curve(m.seed, m.vs)}${kpiCells(m)}`
    : `<svg width="100%" height="44"><rect width="100%" height="44" fill="var(--seg)"/></svg>
       <div class="kpi blank">${KPI_LABELS[m.type].map(l => `<div><b>—</b>${l}</div>`).join("")}</div>`;
  return `<div class="sec">구매 목록 미리보기</div>
    <div class="panel card">${head}<div class="p-body">
      <div class="nm">${esc(m.name)}</div><div class="by">${m.seller} · v1 · ${esc(m.desc)}</div>
      ${body}<div class="card-foot"><span class="price">유료</span><button class="btn sm pri" disabled>구매</button></div>
    </div></div>
    <div class="preview-cap">${passed ? "성적은 검증 결과 — 제작자 수정 불가" : "회색 칸은 검증이 채움"}</div>`;
}

function uploadHtml() {
  const u = SELL.upload;
  const names = ["① 가져오기", "② 정보", "③ 검증", "④ 판매 설정"];
  const steps = names.map((n, i) => `<div class="${i + 1 === u.step ? "on" : i + 1 < u.step ? "done" : ""}">${n}</div>`).join("");
  let body = "", foot = "";

  /* 1단계 = 규격·프롬프트 챙기기 + 모듈 파일 올리기. MCP로 보내온 모델을 화면에서 승인하는 자리는 두지 않는다
     — LLM은 규격·시세·백테스트만 쓰고, 올리는 것은 사람이 파일로 한다(2026-09-17 사용자 결정) */
  if (u.step === 1) {
    body = `<div class="kindrow">
      <select id="u-kind">${Object.entries(TYPES).map(([k, v]) => `<option value="${k}"${u.type === k ? " selected" : ""}>${v}</option>`).join("")}</select></div>
    <div class="ways">
      <div class="way">
        <div class="sec">스키마 정의서</div>
        ${schemaTable(u.type)}
        <div class="sec pickrow">보낼 프롬프트
          <button class="btn sm" data-act="copy" style="margin-left:auto">${u.copied ? "복사됨" : "복사"}</button></div>
        <textarea class="codebox" id="u-prompt" readonly>${esc(promptText(u.type))}</textarea>
      </div>
      <div class="way">
        <div class="sec">모듈 올리기</div>
        <label class="drop${u.file ? " has" : ""}" id="u-drop">
          <input type="file" id="u-file" accept=".py,.zip" hidden>
          ${u.file ? `<b>${esc(u.file.name)}</b><span class="note">${u.file.size}</span>` : "업로드"}
        </label>
      </div>
    </div>`;
    foot = `<button class="btn" data-act="cancel">취소</button><button class="btn pri" data-act="next"${u.file ? "" : " disabled"}>다음: 정보</button>`;
  }

  if (u.step === 2) {
    body = `<div class="two">
      <div>
        <div class="fld"><div class="lb">올린 파일</div><div class="ro">${esc(u.file ? u.file.name : "")} <span class="note">${u.file ? u.file.size : ""}</span></div></div>
        <div class="fld"><div class="lb">종류</div><div class="ro">${TYPES[u.type]}</div></div>
        <div class="fld"><div class="lb">이름</div><input type="text" id="u-name" value="${esc(u.name)}" maxlength="30"></div>
        <div class="fld"><div class="lb">버전</div><div class="ro">v1 <span class="note">새 모델</span></div></div>
        <div class="fld"><div class="lb">한 줄 설명</div><input type="text" id="u-desc" value="${esc(u.desc)}" maxlength="40" placeholder="무엇을 하는 모델인지"></div>
      </div>
      <div id="pv">${previewCard(u, false)}</div>
    </div>`;
    foot = `<button class="btn" data-act="prev">이전</button><button class="btn pri" data-act="verify"${u.name.trim() ? "" : " disabled"}>검증 시작</button>`;
  }

  if (u.step === 3) {
    const done = u.progress >= 100;
    body = `<div class="two">
      <div>
        <div class="sec">자동 검사</div>
        <table class="check">${CHECKS.slice(0, 4).map(([, l]) => `<tr><td>${l}</td><td><span class="badge ok">통과</span></td></tr>`).join("")}
          <tr><td>실행 시간 1분 이내</td><td><span class="badge ok">통과</span></td></tr></table>
      </div>
      <div>
        <div class="sec">백테스트</div>
        <div class="num" style="font-size:12.5px"><span id="u-pct">${u.progress}</span>% · 2024-08 ~ 2026-09</div>
        <div class="bar"><i id="u-bar" style="width:${u.progress}%"></i></div>
        <div class="sec">미래 데이터 참조</div>
        <div>${done ? '<span class="badge ok">없음</span>' : '<span class="badge wait">진행 중</span>'}</div>
        <div class="sec">기준선 비교</div>
        <div style="font-size:12.5px">${done ? '<b class="c-up">+5.3%p</b> <span class="note">기준선: 무작위 대비</span>' : '<span class="note">백테스트 끝나면</span>'}</div>
      </div>
    </div>`;
    foot = `<button class="btn" data-act="close">닫기 — 검증은 계속</button><button class="btn pri" data-act="next"${done ? "" : " disabled"}>다음: 판매 설정</button>`;
  }

  if (u.step === 4) {
    body = `<div class="two">
      <div>
        <div class="fld"><div class="lb">검증 결과</div><div><span class="badge ok">자동 검사 통과</span> <span class="badge ok">백테스트 통과</span></div></div>
        <div class="fld"><div class="lb">가격</div><input type="text" id="u-price" value="${esc(u.price)}" placeholder="과금 방식 미정"></div>
        <div class="fld"><div class="lb">공개</div><label class="chk"><input type="checkbox" checked disabled>구매 목록에 노출</label></div>
        <div class="note">판매 시작은 과금 방식·법적 검토 뒤 열림</div>
      </div>
      <div>${previewCard(u, true)}</div>
    </div>`;
    foot = `<button class="btn" data-act="save">검증 통과로 저장</button><button class="btn pri" disabled title="과금 방식·법적 검토 뒤">판매 시작</button>`;
  }

  return `<div class="modal-back" data-upload-back><div class="modal panel">
    <div class="p-head"><span class="p-title">새 모델 올리기</span><button class="btn sm" style="margin-left:auto" data-act="close">닫기</button></div>
    <div class="p-body"><div class="steps">${steps}</div>${body}<div class="row-btns">${foot}</div></div>
  </div></div>`;
}

/* 창을 닫으면 방금 다룬 모델이 있는 종류 탭·행을 골라둔다 — 검증은 닫아도 계속 */
function closeUpload() {
  const u = SELL.upload;
  if (u && u.rowId) { SELL.sel = u.rowId; SELL.type = u.type; }
  SELL.upload = null;
  renderSell();
}

/* 검증 진행(예시): 3초 남짓 걸려 끝남. 창을 닫아도 계속되고, 표의 "검증 중" 행이 끝나면 "검증 통과"로 바뀐다 */
function runVerify() {
  const u = SELL.upload;
  const row = { id: "s" + Date.now(), name: u.name.trim(), type: u.type, ver: 1, status: "verify", k: null, buys: null,
                via: "올린 파일 — " + u.file.name, at: "방금", checks: { spec: 1, key: 1, net: 1, order: 1, future: null }, bt: "진행 중" };
  MY = [row, ...MY];
  u.rowId = row.id; u.step = 3; u.progress = 0;
  renderSell();
  clearInterval(SELL.timer);
  SELL.timer = setInterval(() => {
    u.progress = Math.min(100, u.progress + 7);
    if (u.progress >= 100) {
      clearInterval(SELL.timer);
      Object.assign(row, { status: "passed", k: PASS_K[row.type], bt: "통과", checks: { spec: 1, key: 1, net: 1, order: 1, future: 1 } });
      if (TAB === "upload") renderSell();   // 분석 탭(모델 목록)을 덮어쓰지 않게 업로드 탭에서만
      return;
    }
    const pct = $("#u-pct"), bar = $("#u-bar");
    if (SELL.upload === u && u.step === 3 && pct) { pct.textContent = u.progress; bar.style.width = u.progress + "%"; }
  }, 220);
}

$("#main").addEventListener("click", e => {
  const t = e.target.closest("[data-ttab],[data-stab],[data-detail],[data-detail-close],[data-modal-back],[data-upload-back],[data-buy],[data-row],[data-act]");
  if (!t) return;
  if (t.dataset.ttab) { BUY.type = t.dataset.ttab; renderBuy(); }
  else if (t.dataset.detail) { BUY.sel = t.dataset.detail; renderBuy(); }
  else if (t.dataset.detailClose !== undefined) { BUY.sel = null; renderBuy(); }
  else if (t.dataset.modalBack !== undefined) {   // 모달 바깥(어두운 배경)을 직접 눌러도 닫힘
    if (e.target === t) { BUY.sel = null; renderBuy(); }
  }
  else if (t.dataset.uploadBack !== undefined) {   // 올리기 창도 바깥을 누르면 닫힘(검증은 계속)
    if (e.target === t) closeUpload();
  }
  else if (t.dataset.buy) {
    BUY.hint[t.dataset.buy] = "다운로드 준비 중 — 마켓 DB 연결 뒤";
    BUY.last = t.dataset.buy;   /* 목록에서 눌렀을 때도 안내가 보이게 */
    renderBuy();
  } else if (t.dataset.stab) { SELL.type = t.dataset.stab; renderSell(); }
  else if (t.dataset.row) { SELL.sel = t.dataset.row; renderSell(); }
  else {
    const u = SELL.upload, act = t.dataset.act;
    if (act === "upload") startUpload();
    else if (act === "copy") {
      const box = $("#u-prompt");
      box.select();
      try { document.execCommand("copy"); } catch (err) {}
      u.copied = true; renderSell();
    }
    else if (act === "cancel" || act === "close") closeUpload();
    else if (act === "next") { u.step++; renderSell(); }
    else if (act === "prev") { u.step--; renderSell(); }
    else if (act === "verify") runVerify();
    else if (act === "save") closeUpload();
  }
});

document.addEventListener("input", e => {
  const u = SELL.upload;
  if (!u) return;
  if (e.target.id === "u-name" || e.target.id === "u-desc") {
    u[e.target.id === "u-name" ? "name" : "desc"] = e.target.value;
    $("#pv").innerHTML = previewCard(u, false);
    const vb = document.querySelector('[data-act="verify"]');
    if (vb) vb.disabled = !u.name.trim();
  }
  if (e.target.id === "u-price") u.price = e.target.value;
});
document.addEventListener("change", e => {
  const u = SELL.upload;
  if (!u) return;
  if (e.target.id === "u-kind") { u.type = e.target.value; u.copied = false; renderSell(); }
  if (e.target.id === "u-file" && e.target.files[0]) takeFile(u, e.target.files[0]);
});

/* 모듈 파일 받기 — 고르기·끌어놓기 둘 다 같은 자리로 (2026-09-17 검수) */
function takeFile(u, f) {
  const kb = f.size / 1024;
  u.file = { name: f.name, size: kb < 1024 ? Math.max(1, Math.round(kb)) + "KB" : (kb / 1024).toFixed(1) + "MB" };
  u.name = f.name.replace(/\.[^.]+$/, "").slice(0, 30);   // 1단계에서만 들어오므로 이름은 파일 이름으로 채운다
  renderSell();
}

document.addEventListener("dragover", e => {
  const d = e.target.closest && e.target.closest("#u-drop");
  if (!d) return;
  e.preventDefault();
  d.classList.add("over");
});
document.addEventListener("dragleave", e => {
  const d = e.target.closest && e.target.closest("#u-drop");
  if (d) d.classList.remove("over");
});
document.addEventListener("drop", e => {
  const d = e.target.closest && e.target.closest("#u-drop");
  if (!d) return;
  e.preventDefault();
  const f = e.dataTransfer.files[0];
  if (f && SELL.upload) takeFile(SELL.upload, f);
});

/* ═══════════ 탭 — 마켓은 구분자 제목(2026-09-16 사용자 지정): 분석 = 모델 목록 / 업로드 = 올리기·내 모델 관리 ═══════════ */
let TAB = new URLSearchParams(location.search).get("tab") === "upload" ? "upload" : "analysis";

function syncUrl() {
  const url = new URL(location.href);
  TAB === "analysis" ? url.searchParams.delete("tab") : url.searchParams.set("tab", TAB);
  history.replaceState(null, "", url);
}

function render() {
  /* 탭 표시는 사이드바 하위 메뉴(마켓 밑 분석·업로드)가 담당 */
  document.querySelectorAll("[data-mtab]").forEach(a => a.classList.toggle("on", a.dataset.mtab === TAB));
  if (TAB === "analysis") renderBuy();
  else renderSell();   /* 업로드 탭 = 내 모델 관리. 올리기는 목록의 "새 모델 올리기"가 띄우는 새 창으로(2026-09-17 검수) */
}

document.querySelector(".side").addEventListener("click", e => {
  const a = e.target.closest("[data-mtab]");
  if (!a) return;
  e.preventDefault();          // 같은 화면 안 전환 — 새로 안 불러온다
  TAB = a.dataset.mtab;
  syncUrl();
  render();
});
render();
</script>
<script>
/* 사이드바 그룹 접기(2026-09-15 사용자 지정) — 제목 클릭으로 여닫고 선택은 기억. 홀로 항목(solo)은 접히지 않음 */
(function () {
  let closed = [];
  try { closed = JSON.parse(localStorage.getItem("odin-nav-closed") || "[]"); } catch (e) {}
  const apply = (g, on) => {
    g.classList.toggle("closed", on);
    for (let el = g.nextElementSibling; el && el.classList.contains("nav") && !el.classList.contains("solo"); el = el.nextElementSibling)
      el.classList.toggle("hid", on);
  };
  document.querySelectorAll(".nav-group").forEach(g => {
    const name = g.textContent.trim();
    apply(g, closed.includes(name));
    g.addEventListener("click", () => {
      const on = !g.classList.contains("closed");
      apply(g, on);
      const i = closed.indexOf(name);
      if (on && i < 0) closed.push(name); else if (!on && i >= 0) closed.splice(i, 1);
      try { localStorage.setItem("odin-nav-closed", JSON.stringify(closed)); } catch (e) {}
    });
  });
})();
</script>
<script>
/* 앱 껍데기(index.html) 안에서 열렸으면 지금 위치·제목을 알린다 — 새로고침해도 이 화면·탭으로 돌아오게 */
(function () {
  if (window.parent === window) return;
  let last = "";
  const tell = () => {
    const screen = location.pathname.split("/").pop() + location.search;
    if (screen === last) return;
    last = screen;
    window.parent.postMessage({ type: "odin-screen", screen, title: document.title }, "*");
  };
  tell();
  setInterval(tell, 500);   // 탭·날짜 전환은 history.replaceState라 load 이벤트가 없어 짧게 확인
})();
</script>
</body>
</html>
