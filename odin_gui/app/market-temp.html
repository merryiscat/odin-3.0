<style>
/* ═══════════════════════════════════════════════════════════════
   시장 온도(S1) — v10 "Koyfin 문법" (2026-09-14, 사용자가 레퍼런스 지정)
   - 구조: 다크 크롬(상단바+사이드바) + 밝은 캔버스 + 흰 패널(얇은 테두리·4px).
     밀도 높게, 패널 머리줄 + 촘촘한 본문.
   - 데이터색은 한국 관례 유지: 상승 빨강 / 하락 파랑 (Koyfin의 녹/적은 안 따름).
   - 데이터: 국내 탭 = Supabase 실데이터(v9에서 연결). 미국 탭은 목데이터 라벨.
   - v11 (2026-09-14): 장중엔 실시간 판정(basis=live, 1분)을 읽고 1분마다 다시 읽음.
     끊김·장 마감(종가 판정 전)·종가 기준은 상단바에만 표시. 지속 시간·전환 대기 줄 추가.
     사용자 검수로 뺌: 카드 머리줄 꼬리표, 거래대금 배율 줄, 폭·10거래일 소제목, 해외 시장 머리줄,
     (2차) 10거래일 상태 띠, "오늘의 상태" 소제목. (3차) 해외 시장 표 전체(목데이터였음).
   - 날짜 선택(2026-09-15): 상단바 ‹ 날짜 › 오늘. 지난 날짜 = 그날 종가 판정(없으면 "판정 없음"),
     주소에 ?date=YYYY-MM-DD로 남음. 1분 갱신은 오늘을 볼 때만.
   ═══════════════════════════════════════════════════════════════ */
:root {
  /* 크롬(어두운 틀) */
  --chrome: #17181C; --chrome-2: #26282E; --chrome-ink: #E8EAED; --chrome-muted: #9AA0A8;
  /* 캔버스(밝은 바탕)와 패널 */
  --canvas: #F4F5F7; --panel: #FFFFFF; --line: #E3E5E8;
  --ink: #191F28; --muted: #6B7684; --accent: #2F6FED;
  /* 데이터색 (한국 관례) */
  --up: #F04452; --down: #3182F6; --flat: #8B95A1; --hot: #E8590C;
  --live: #17A05D; --seg: #E9EBEE;
  --emg: #173FA6;   /* 긴급(주간) — 하락 파랑보다 진하게 */
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body { font-family: 'SUIT Variable', SUIT, 'Malgun Gothic', sans-serif;
       background: var(--canvas); color: var(--ink); display: flex; flex-direction: column; }
.mono { font-family: 'IBM Plex Mono', Consolas, monospace; font-variant-numeric: tabular-nums; }

/* ── 상단바 (다크 크롬, 전체 폭) ── */
.top { height: 48px; background: var(--chrome); color: var(--chrome-ink);
       display: flex; align-items: center; padding: 0 20px; gap: 24px; flex: none; }
.logo { font-size: 14px; font-weight: 800; letter-spacing: .35em; }
.clock { font-family: 'IBM Plex Mono', Consolas, monospace; font-size: 12px; color: var(--chrome-muted); }
/* 판정 모델 선택 — 카드들 위의 드랍박스(2026-09-16 검수: 제목 대신 마켓-리스트의 모델을 고름).
   고른 한 모델이 화면 전체(코스피·코스닥 × 실시간·주간)를 담당한다 */
.mtitle { margin-bottom: 12px; }
.mtitle select { font-family: inherit; font-size: 14px; font-weight: 800; color: var(--ink);
                 background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
                 padding: 7px 10px; cursor: pointer; }
.clock .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%;
              background: var(--live); margin-right: 8px; }
.tabs { margin-left: 12px; display: flex; gap: 4px; }
/* 날짜 선택 (상단바 우측, 탭 앞) — 이전/다음 거래일 + 달력 입력 + 오늘 */
.datebar { margin-left: auto; display: flex; align-items: center; gap: 4px; }
.datebar input { background: var(--chrome-2); color: var(--chrome-ink); border: 0; border-radius: 4px;
                 padding: 5px 8px; font-family: 'IBM Plex Mono', Consolas, monospace; font-size: 12px;
                 color-scheme: dark; }
.datebar .tab:disabled { opacity: .35; cursor: default; }
.datebar #d-prev, .datebar #d-next { font-size: 15px; padding: 2px 10px; line-height: 1; }
.datebar[hidden] { display: none; }   /* display:flex가 hidden 속성을 덮지 않게 */
.tab { background: none; border: 0; padding: 6px 12px; cursor: pointer; font-family: inherit;
       font-size: 12px; font-weight: 500; color: var(--chrome-muted); border-radius: 4px; }
.tab.on { background: var(--chrome-2); color: var(--chrome-ink); font-weight: 700; }
/* 개정 번호는 화면에 안 보이게 body[data-rev]로만(2026-09-16 검수 "빼") — 검수 어긋남 확인용 */

/* ── 아래: 사이드바 + 본문 ── */
.wrap { flex: 1; display: flex; min-height: 0; }
.side { width: 192px; flex: none; background: var(--chrome); padding: 16px 0; overflow-y: auto; }
/* 사이드바 위계 통일(2026-09-16 사용자 지정): 제목 = 파이프라인·마켓·연구소·계좌·리서치(14px 굵게),
   소제목 = 그 아래 항목 전부(12px, 34px 들여쓰기). 접기 화살표는 묶음 제목(링크 아닌 것)에만. */
.nav-group { font-size: 14px; font-weight: 700; color: var(--chrome-muted);
             padding: 7px 20px; margin-top: 14px; cursor: pointer; }
.nav-group:first-child { margin-top: 0; }
.nav-group::after { content: "▾"; float: right; font-size: 10px; margin-top: 3px; }   /* 접기 표시(순수 기호) */
.nav-group.closed::after { content: "▸"; }
.nav.hid { display: none; }
.nav { display: block; font-size: 12px; padding: 7px 20px 7px 34px; color: var(--chrome-muted);
       font-weight: 400; text-decoration: none; cursor: default; border-left: 2px solid transparent; }
.nav.on { color: var(--chrome-ink); font-weight: 700; background: var(--chrome-2);
          border-left-color: var(--accent); }
/* 제목이면서 링크인 항목(마켓·계좌) — 묶음 제목과 같은 크기 (클래스명 top은 상단바 .top과 겹침 주의) */
.nav.solo { margin-top: 14px; font-size: 14px; font-weight: 700; padding-left: 20px; }
a.nav[href*=".html"] { cursor: pointer; }   /* 실제 화면이 있는 메뉴만 손가락 커서(?tab=… 하위 메뉴 포함) */

.main { flex: 1; min-width: 0; overflow-y: auto; padding: 16px; }
.note { font-size: 11px; color: var(--chrome-muted); }

/* ── 패널 (Koyfin 문법: 흰 바탕 + 얇은 테두리 + 4px + 머리줄) ── */
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(430px, 1fr)); gap: 12px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.p-head { display: flex; align-items: baseline; gap: 12px; padding: 10px 14px;
          border-bottom: 1px solid var(--line); }
.p-title { font-size: 13px; font-weight: 800; letter-spacing: .02em; }
/* Koyfin 문법: 숫자도 본문체(그로테스크) + tabular 숫자폭 */
.p-px { font-variant-numeric: tabular-nums; font-size: 16px; font-weight: 700; margin-left: auto; }
.p-chg { font-variant-numeric: tabular-nums; font-size: 12px; font-weight: 700; }
.c-up { color: var(--up); } .c-down { color: var(--down); } .c-flat { color: var(--flat); }
.p-body { padding: 14px; }

/* 섹션 라벨(패널 안 작은 제목). 판정 모델 이름은 칸마다 달지 않고 상단바 "기본 모델" 하나로(2026-09-16 검수) */
.sec { font-size: 10.5px; font-weight: 600; letter-spacing: .1em; color: var(--muted);
       text-transform: uppercase; margin: 14px 0 6px; display: flex; align-items: baseline; }
.sec:first-child { margin-top: 0; }

/* 상태 워드 — 밀도 높은 문법에 맞게 32px */
.word { font-weight: 800; letter-spacing: -0.01em; line-height: 1.1; font-size: 30px; }
.word.up { color: var(--up); } .word.down { color: var(--down); }
.word.flat { color: var(--flat); } .word.hot { color: var(--hot); }
.sectors { font-size: 13px; font-weight: 700; margin-top: 4px; }
.sub { font-family: 'IBM Plex Mono', Consolas, monospace; font-size: 12px; color: var(--muted);
       margin-left: 10px; white-space: nowrap; display: inline-block; }
.meta { font-size: 12px; color: var(--muted); margin-top: 8px; }
.meta b { color: var(--ink); font-family: 'IBM Plex Mono', Consolas, monospace; }

.state-row { display: flex; align-items: flex-start; gap: 16px; }
.spark { margin-left: auto; flex: none; text-align: right; }
.spark svg { display: block; }
.spark-nm { font-size: 10px; color: var(--muted); margin-top: 3px; }

/* 폭 바 */
.b-bar { display: flex; gap: 2px; margin-top: 14px; }   /* 소제목을 뺀 자리 간격 */
.b-bar i { flex: 1 1 0; height: 5px; border-radius: 1px; background: var(--seg); }
.b-bar i.d { background: var(--down); }
.b-bar i.u { background: var(--up); }
.b-nm { font-family: 'IBM Plex Mono', Consolas, monospace; font-size: 11px; color: var(--muted); margin-top: 5px; }

.pending { font-size: 12px; color: var(--muted); }
.empty { padding: 28px 14px; font-size: 13px; color: var(--muted); }

/* 실시간/주간 구분(2026-09-15 사용자 피드백): 두 칸 모두 소제목 + 판정 재료 칩, 주간 앞에 헤어라인 */
.chip { display: inline-flex; align-items: center; gap: 5px; margin-left: 8px; vertical-align: middle;
        font-family: 'IBM Plex Mono', Consolas, monospace; font-size: 10px; font-weight: 600;
        letter-spacing: .06em; text-transform: none; }
.chip.live { color: var(--live); }
.chip.live i { width: 6px; height: 6px; border-radius: 50%; background: var(--live); }
.chip.flat { color: var(--muted); font-weight: 500; }
.sec.split { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 16px; }

/* 최근 20거래일 상태 띠(좌 = 과거, 우 = 최근) — 실시간·주간 각각(2026-09-15 사용자 피드백) */
.strip { display: flex; gap: 2px; margin-top: 12px; }
.strip i { flex: 1 1 0; height: 5px; border-radius: 1px; background: var(--seg); }
.strip-nm { font-family: 'IBM Plex Mono', Consolas, monospace; font-size: 10px; color: var(--muted); margin-top: 4px; }

/* 주간 — 이름표 하나 + 근거 한 줄 (2026-09-15, 초안 규칙. 10거래일 띠는 실시간 쪽 검수 결과에 맞춰 두지 않음)
   색: 상승장 빨강 / 하락장 파랑 / 박스권 회색 / 변동장 먹색(방향 없음) / 긴급 = 파랑 바탕 반전 */
.word.ink { color: var(--ink); }
.word.emg { color: #fff; background: var(--down); padding: 1px 8px; border-radius: 3px; }
.w-why { font-size: 12px; color: var(--muted); margin-top: 6px; }
.w-why b { color: var(--ink); font-variant-numeric: tabular-nums; }
.w-draft { font-size: 10.5px; color: var(--muted); margin-left: 8px; font-weight: 500; letter-spacing: 0; text-transform: none; }
</style>
</head>

function chgHtml(chg, cls) {
  const c = chg > 0.05 ? "c-up" : chg < -0.05 ? "c-down" : "c-flat";
  const s = chg > 0 ? "+" : "";

function sparkHtml(closes, label = "최근 30일 종가") {

  const W = 132, H = 34;

  const xy = closes.map((p, i) =>
    `${(i / (closes.length - 1) * W).toFixed(1)},${(H - 3 - (p - min) / span * (H - 6)).toFixed(1)}`).join(" ");
  const col = closes[closes.length - 1] >= closes[0] ? "var(--up)" : "var(--down)";
  return `<div class="spark"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
    <polyline points="${xy}" fill="none" stroke="${col}" stroke-width="1.5"/>
  </svg><div class="spark-nm">${label}</div></div>`;
}

function breadthHtml(b) {
  if (!b || !b.total) return "";
  const flat = Math.max(b.total - b.up - b.down, 0);
  const segs = Array(b.down).fill('<i class="d"></i>').join("")
             + Array(flat).fill("<i></i>").join("")
             + Array(b.up).fill('<i class="u"></i>').join("");
  return `<div class="b-bar">${segs}</div>
    <div class="b-nm">하락 ${b.down} · 보합 ${flat} · 상승 ${b.up} / ${b.total}</div>`;
}

function signed(v, digits = 2) {
  return v == null ? "—" : `${v > 0 ? "+" : ""}${Number(v).toFixed(digits)}%`;
}

/* 주간 칸: 이름표 하나만(근거 문구는 뺌 — 2026-09-15 검수). 재료 표기는 실시간과 같은 칩 방식 */
function weekChip(w) {
  if (!w) return "";
  return w.basis === "live"
    ? `<span class="chip live"><i></i>LIVE ${w.asofHm}</span>`
    : `<span class="chip flat">${w.asof} 종가 기준</span>`;
}

function weekWord(w) {
  if (w === undefined) return `<div class="pending">설계 중</div>`;               // 목데이터(미국 탭 등)
  if (!w) return `<div class="pending">주간 판정 없음 — 아직 DB에 기록 전</div>`;
  const W = WEEK[w.state] || WEEK.box;
  return `<span class="word ${W.fam}">${W.nm}</span>`;
}

/* 최근 20거래일 상태 띠 — 좌 = 과거, 우 = 최근. 칸 색 = 상태 색, 올리면 날짜·상태 */
function stripHtml(cells, vocab, label) {
  if (!cells || !cells.length) return "";
  const COL = { up: "--up", down: "--down", flat: "--flat", hot: "--hot", ink: "--ink", emg: "--emg" };
  const seg = cells.map(c => {
    const v = vocab[c.state] || { fam: "flat", nm: c.state };
    return `<i style="background:var(${COL[v.fam] || "--flat"})" title="${c.d.slice(5)} ${v.nm}"></i>`;
  }).join("");
  return `<div class="strip">${seg}</div><div class="strip-nm">${label}</div>`;
}

/* 판정 재료 구분: 상단바 + 카드 안 소제목 칩(실시간/주간 구분 — 2026-09-15 사용자 피드백으로 복원) */
function rtChip(mk) {
  if (mk.mode === "live") return `<span class="chip live"><i></i>LIVE ${mk.asofHm}</span>`;
  if (mk.mode === "stale") return `<span class="chip flat">끊김 — 마지막 ${mk.asofHm}</span>`;
  if (mk.mode === "closing") return `<span class="chip flat">마지막 ${mk.asofHm} — 종가 판정 전</span>`;
  if (mk.mode === "eod") return `<span class="chip flat">${mk.asof} 종가 기준</span>`;
  return "";
}

function marketCard(mk) {
  const S = STATE[mk.state] || STATE.flat;
  const sectors = mk.sectors && mk.sectors.length
    ? `<div class="sectors word ${S.fam}" style="font-size:13px">${mk.sectors.map(s => SECTOR_SHORT[s] || s).join("·")}</div>` : "";
  const since = mk.since
    ? `<div class="meta">${mk.since.from}부터 <b>${mk.since.minutes}분</b>째</div>` : "";
  const pending = mk.pending
    ? `<div class="meta">전환 대기 — ${(STATE[mk.pending.state] || STATE.flat).nm} <b>${mk.pending.minutes}/3분</b></div>` : "";
  return `<div class="panel">
    <div class="p-head">
      <span class="p-title">${mk.name}</span>
      <span class="p-px">${mk.px}</span><span>${mk.chg == null ? "" : chgHtml(mk.chg, "p-chg")}</span>
    </div>
    <div class="p-body">
      <div class="sec">실시간${rtChip(mk)}</div>
      <div class="state-row">
        <div>
          <span class="word ${S.fam}">${S.nm}</span><span class="sub">${mk.chg == null ? "" : chgHtml(mk.chg, "")}</span>
          ${sectors}${since}${pending}
        </div>
        ${sparkHtml(mk.closes, mk.sparkLabel)}
      </div>
      ${breadthHtml(mk.b)}
      ${stripHtml(mk.rtStrip, STATE, "최근 20거래일 · 종가 판정")}
      <div class="sec split">주간${weekChip(mk.week)}</div>
      <div class="state-row">
        <div>${weekWord(mk.week)}</div>
        ${sparkHtml(mk.closes90, "최근 90일 종가")}
      </div>
      ${stripHtml(mk.wStrip, WEEK, "최근 20거래일 · 주간 판정")}
    </div>
  </div>`;
}

/* ═══════════ 실데이터 조회 → 카드 재료로 변환 ═══════════
   판정 줄 고르는 순서(시장별):
     live    — 정규장(09:00~15:35)이고 실시간 판정(basis=live)이 5분 안에 있음 → 1분 판정
     stale   — 정규장인데 오늘 실시간 판정이 5분 넘게 끊김 → 마지막 실시간 판정 + 끊김 표시
     closing — 장 마감 뒤인데 오늘 종가 판정이 아직 없음 → 오늘 마지막 실시간 판정
     eod     — 그 밖 → 최신 종가 판정(basis=eod)                                         */
const MARKETS = ["KR-KOSPI", "KR-KOSDAQ"];
const LIVE_FRESH_MIN = 5;

/* 한국시간 기준 날짜·시각 (보는 PC의 시간대와 무관하게) */
function kst(d) {
  const s = new Intl.DateTimeFormat("sv-SE", { timeZone: "Asia/Seoul", year: "numeric", month: "2-digit",
    day: "2-digit", hour: "2-digit", minute: "2-digit", hour12: false }).format(d);
  return { date: s.slice(0, 10), hm: s.slice(11, 16) };
}

function fmtPx(v) {
  return Number(v).toLocaleString("ko-KR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

/* 같은 상태가 이어진 시작 시각·분 (오늘 실시간 줄, 시각 오름차순) */
function sinceOf(liveRows) {
  const last = liveRows[liveRows.length - 1];
  let i = liveRows.length - 1;
  while (i > 0 && liveRows[i - 1].state_code === last.state_code) i--;
  const from = new Date(liveRows[i].as_of);
  return { from: kst(from).hm, minutes: Math.round((new Date(last.as_of) - from) / 60000) + 1 };
}

/* 거래일 목록(날짜 이동 버튼용) — 지수 일봉이 있는 날 */
async function loadDays() {
  const sb = window.supabase.createClient(SB_URL, SB_KEY);
  const r = await sb.from("raw_index_ohlc").select("date").eq("market", "KR-KOSPI")
    .order("date", { ascending: false }).limit(1000);
  if (r.error) throw r.error;
  return r.data.map(x => x.date).reverse();
}

/* sel = 볼 날짜(YYYY-MM-DD). null이면 오늘(실시간 자동 판단). 지난 날짜는 그날 장 마감 뒤 시점으로 본다. */
async function loadKR(sel = null) {
  const sb = window.supabase.createClient(SB_URL, SB_KEY);
  const realNow = new Date();
  const today = kst(realNow).date;
  const day = sel && sel < today ? sel : today;
  const past = day !== today;
  const now = past ? new Date(`${day}T23:59:00+09:00`) : realNow;
  const dayStart = `${day}T00:00:00+09:00`, dayEnd = `${day}T23:59:59+09:00`;
  const [st, ix, live, snap, wk, wkE] = await Promise.all([
    /* 실시간 모델의 종가 판정 — 카드(최신 1줄) + 20거래일 상태 띠 재료 */
    sb.from("state_market_temp")
      .select("as_of,market,state_code,state_sectors,breadth_up,breadth_down,breadth_total,metrics")
      .eq("model_id", MODEL).eq("scope", "rt").eq("basis", "eod").lte("as_of", dayEnd)
      .order("as_of", { ascending: false }).limit(60),
    /* 일봉 — 실시간 스파크 30일 + 주간 스파크 90일 (두 시장 합쳐 260줄) */
    sb.from("raw_index_ohlc")
      .select("date,market,close")
      .in("market", MARKETS).lte("date", day)
      .order("date", { ascending: false }).limit(260),
    sb.from("state_market_temp")
      .select("as_of,market,state_code,state_sectors,breadth_up,breadth_down,breadth_total,metrics")
      .eq("model_id", MODEL).eq("scope", "rt").eq("basis", "live").gte("as_of", dayStart).lte("as_of", dayEnd)
      .order("as_of", { ascending: true }).limit(1000),
    sb.from("raw_market_snapshot")
      .select("ts,market,price,change_pct,source")
      .eq("kind", "index").in("market", MARKETS).gte("ts", dayStart).lte("ts", dayEnd)
      .order("ts", { ascending: false }).limit(20),
    /* 주간 판정(scope=w) — 보는 날짜까지의 시장별 최신 줄. 장중엔 라이브(1분) 줄이 섞이므로 basis도 읽는다.
       (고른 모델에 주간이 없으면 W_MODEL이 null — 빈 이름으로 조회해 "판정 없음"이 뜨게 둔다) */
    sb.from("state_market_temp")
      .select("as_of,market,state_code,metrics,basis")
      .eq("model_id", W_MODEL || "-").eq("scope", "w").lte("as_of", dayEnd)
      .order("as_of", { ascending: false }).limit(4),
    /* 주간 종가 판정만 따로 — 20거래일 주간 상태 띠 재료(라이브 줄은 하루 수백 개라 띠에 못 씀) */
    sb.from("state_market_temp")
      .select("as_of,market,state_code")
      .eq("model_id", W_MODEL || "-").eq("scope", "w").eq("basis", "eod").lte("as_of", dayEnd)
      .order("as_of", { ascending: false }).limit(60),
  ]);
  for (const r of [st, ix, live, snap]) if (r.error) throw r.error;
  if (wk.error) console.warn("주간 판정 조회 실패:", wk.error.message);   // 주간이 없어도 실시간 카드는 그린다
  if (wkE.error) console.warn("주간 띠 조회 실패:", wkE.error.message);

  const nowK = kst(now);
  const inSession = !past && nowK.hm >= "09:00" && nowK.hm <= "15:35";
  const out = [];
  for (const m of MARKETS) {
    const eodRows = st.data.filter(r => r.market === m);
    const idxAll = ix.data.filter(r => r.market === m);
    const liveRows = live.data.filter(r => r.market === m);
    const lastLive = liveRows[liveRows.length - 1];
    const ageMin = lastLive ? (now - new Date(lastLive.as_of)) / 60000 : Infinity;
    const eodToday = eodRows.length && kst(new Date(eodRows[0].as_of)).date === day;

    let mode = "eod";
    if (lastLive && inSession) mode = ageMin <= LIVE_FRESH_MIN ? "live" : "stale";
    else if (lastLive && nowK.hm > "15:35" && !eodToday) mode = "closing";

    const row = mode === "eod" ? eodRows[0] : lastLive;
    if (!row) continue;
    const rowDate = kst(new Date(row.as_of)).date;
    if (past && rowDate !== day) continue;            // 지난 날짜인데 그날 판정이 없음(휴장일 등)
    const card = {
      name: m.replace("KR-", ""), mode,
      state: row.state_code,
      sectors: row.state_sectors || null,
      b: row.breadth_total ? { up: row.breadth_up, down: row.breadth_down, total: row.breadth_total } : null,
      asof: rowDate, asofHm: kst(new Date(row.as_of)).hm,
    };
    /* 지난 날짜를 볼 땐 그날 주간 줄만(없으면 "판정 없음"), 오늘은 가장 최근 줄 */
    const wRow = (wk.error ? [] : wk.data).find(r => r.market === m);
    const wDate = wRow && kst(new Date(wRow.as_of)).date;
    card.week = wRow && (!past || wDate === day)
      ? { state: wRow.state_code, metrics: wRow.metrics, asof: wDate,
          basis: wRow.basis, asofHm: kst(new Date(wRow.as_of)).hm } : null;
    /* 20거래일 상태 띠(좌 = 과거) — 실시간·주간 각각 종가 판정으로 */
    card.rtStrip = eodRows.slice(0, 20).reverse()
      .map(r => ({ d: kst(new Date(r.as_of)).date, state: r.state_code }));
    card.wStrip = (wkE.error ? [] : wkE.data).filter(r => r.market === m).slice(0, 20).reverse()
      .map(r => ({ d: kst(new Date(r.as_of)).date, state: r.state_code }));
    /* 주간 스파크는 더 긴 창(90일 종가)으로 실시간(30일)과 구분 */
    card.closes90 = idxAll.slice(0, 90).map(r => Number(r.close)).reverse();
    if (mode === "eod") {
      /* 판정 날짜의 일봉에 맞춘다(밤 복사가 판정보다 먼저 들어온 날에도 숫자가 어긋나지 않게) */
      const idx = idxAll.slice(Math.max(idxAll.findIndex(r => r.date <= rowDate), 0));
      if (idx.length < 2) continue;
      card.px = fmtPx(idx[0].close);
      card.chg = (Number(idx[0].close) / Number(idx[1].close) - 1) * 100;
      card.closes = idx.slice(0, 30).map(r => Number(r.close)).reverse();
    } else {
      const idx = idxAll;
      const closes = idx.slice(0, 30).map(r => Number(r.close)).reverse();
      /* 장중 지수값: 오늘 1분 시세(3.0 직접 수집 우선) → 없으면 판정 근거의 등락률만 */
      const ixRow = snap.data.filter(r => r.market === m)
        .sort((a, b) => (b.ts > a.ts) - (b.ts < a.ts) || (a.source === "kis" ? -1 : 1))[0];
      card.px = ixRow ? fmtPx(ixRow.price) : "—";
      card.chg = ixRow && ixRow.change_pct != null ? Number(ixRow.change_pct)
               : row.metrics && row.metrics.chg != null ? Number(row.metrics.chg) : null;
      if (ixRow && (!idx.length || idx[0].date < day)) {
        card.closes = [...closes.slice(1), Number(ixRow.price)];
        card.sparkLabel = `최근 29일 종가 + ${card.asofHm}`;
      } else {
        card.closes = closes;
      }
      card.since = sinceOf(liveRows);
      const raw = row.metrics && row.metrics.raw_state;
      if (raw && raw !== row.state_code) card.pending = { state: raw, minutes: row.metrics.pending_minutes };
    }
    out.push(card);
  }
  return { cards: out, inSession, today: day, past };
}

/* ═══════════ 렌더 ═══════════ */
let KR = null, KR_ERR = false, TAB = "kr";
let SELECTED = null;      // 보고 있는 날짜(null = 오늘)
let DAYS = [];            // 거래일 목록(오름차순)

function clockHtml(kr) {
  if (!kr.cards.length)
    return `<span class="dot" style="background:var(--flat)"></span>${kr.today} 판정 없음 <span class="note">— 휴장일이거나 기록 전</span>`;
  if (kr.past && kr.cards.every(c => c.mode === "eod"))
    return `<span class="dot" style="background:var(--flat)"></span>${kr.today} 종가 기준 <span class="note">— 지난 날짜 보기</span>`;
  const modes = kr.cards.map(c => c.mode);
  const latest = kr.cards.map(c => c.asofHm).sort().pop();
  if (modes.includes("live"))
    return `<span class="dot"></span>LIVE ${latest} 기준 <span class="note">— 1분마다 갱신</span>`;
  if (modes.includes("stale"))
    return `<span class="dot" style="background:var(--flat)"></span>실시간 끊김 — 마지막 판정 ${latest} <span class="note">— 판별기·수집기 확인 필요</span>`;
  if (modes.includes("closing"))
    return `<span class="dot" style="background:var(--flat)"></span>${kr.today} 장 마감 — 실시간 마지막 판정 ${latest} <span class="note">— 종가 판정 전</span>`;
  const note = kr.inSession ? "장중인데 오늘 실시간 판정 없음 — 판별기 미가동" : "장중에는 1분 실시간 판정으로 바뀜";
  return `<span class="dot"></span>${kr.cards[0].asof} 종가 기준 <span class="note">— ${note}</span>`;
}

function render(key) {
  TAB = key;
  const tabs = { kr: "국내주식", us: "미국주식" };
  document.getElementById("tabs").innerHTML = Object.keys(tabs).map(k =>
    `<button class="tab${k === key ? " on" : ""}" onclick="render('${k}')">${tabs[k]}</button>`).join("");

  renderDatebar(key);
  if (key === "kr" && KR) {
    document.getElementById("clock").innerHTML = clockHtml(KR);
    document.getElementById("stacks").innerHTML = KR.cards.length
      ? KR.cards.map(marketCard).join("")
      : `<div class="panel empty">${KR.today}에는 판정이 없습니다 — 휴장일이거나 아직 기록 전입니다.</div>`;
  } else if (key === "kr") {
    document.getElementById("clock").innerHTML =
      `<span class="dot" style="background:var(--flat)"></span>${KR_ERR ? "DB 연결 안 됨 — 목데이터 표시" : "불러오는 중"}`;
    document.getElementById("stacks").innerHTML =
      KR_ERR ? MOCK_US.map(m => marketCard(m)).join("") : "";
  } else {
    document.getElementById("clock").innerHTML =
      `<span class="dot" style="background:var(--flat)"></span>목데이터 <span class="note">— 미국 실제 구성은 한국 검증 후 (보류 9번)</span>`;
    document.getElementById("stacks").innerHTML = MOCK_US.map(m => marketCard(m)).join("");
  }
}

/* ═══════════ 날짜 선택 ═══════════ */
function todayKst() { return kst(new Date()).date; }
function viewDay() { return SELECTED || todayKst(); }

function renderDatebar(key) {
  const bar = document.getElementById("datebar");
  bar.hidden = key !== "kr";                        // 미국 탭은 목데이터라 날짜 개념 없음
  const d = viewDay(), t = todayKst();
  const input = document.getElementById("d-input");
  input.value = d;
  input.max = t;
  if (DAYS.length) input.min = DAYS[0];
  document.getElementById("d-prev").disabled = !DAYS.some(x => x < d);
  document.getElementById("d-next").disabled = d >= t;
  document.getElementById("d-today").disabled = !SELECTED;
}

function selectDay(d) {
  const t = todayKst();
  SELECTED = !d || d >= t ? null : d;
  const url = new URL(location.href);
  if (SELECTED) url.searchParams.set("date", SELECTED); else url.searchParams.delete("date");
  history.replaceState(null, "", url);
  KR = null;                                        // 다른 날짜 데이터가 섞여 보이지 않게 비우고 다시 읽음
  render(TAB);
  refresh();
}

document.getElementById("d-prev").onclick = () => {
  const d = viewDay();
  const prev = DAYS.filter(x => x < d).pop();
  if (prev) selectDay(prev);
};
document.getElementById("d-next").onclick = () => {
  const d = viewDay();
  selectDay(DAYS.find(x => x > d) || null);         // 목록 끝을 넘으면 오늘로
};
document.getElementById("d-today").onclick = () => selectDay(null);
document.getElementById("d-input").onchange = e => selectDay(e.target.value || null);

/* 판정 모델 드랍박스 — 고르면 그 모델의 판정으로 다시 읽는다 */
const modelPick = document.getElementById("model-pick");
modelPick.innerHTML = MODEL_CHOICES.map((c, i) => `<option value="${i}">${c.nm}</option>`).join("");
modelPick.onchange = () => {
  const c = MODEL_CHOICES[modelPick.value];
  MODEL = c.rt;
  W_MODEL = c.w;
  KR = null;                                        // 이전 모델 데이터가 섞여 보이지 않게
  render(TAB);
  refresh();
};

const params = new URLSearchParams(location.search);
const first = params.get("market") === "us" ? "us" : "kr";
if (/^\d{4}-\d{2}-\d{2}$/.test(params.get("date") || "") && params.get("date") < todayKst()) SELECTED = params.get("date");
render(first);

/* 1분마다 다시 읽기(오늘을 볼 때만) — 판별기가 매분 :25초에 쓰므로 :40초쯤 읽는다. 실패하면 직전 화면 유지 */
async function refresh() {
  const want = SELECTED;
  try {
    const data = await loadKR(want);
    if (want !== SELECTED) return;                  // 읽는 사이 날짜를 바꿨으면 버림
    KR = data;
    KR_ERR = false;
  } catch (e) {
    console.warn("실데이터 조회 실패:", e.message || e);
    if (!KR) KR_ERR = true;
  }
  if (TAB === "kr") render("kr");
}
loadDays().then(d => { DAYS = d; render(TAB); }).catch(e => console.warn("거래일 목록 조회 실패:", e.message || e));
refresh();
setTimeout(function tick() {
  if (!SELECTED) refresh();
  setTimeout(tick, 60000);
}, ((100 - new Date().getSeconds()) % 60 || 60) * 1000);
</script>
<script>
/* 사이드바 그룹 접기(2026-09-15 사용자 지정) — 제목 클릭으로 여닫고 선택은 기억. 홀로 항목(solo)은 접히지 않음 */
(function () {
  let closed = [];
  try { closed = JSON.parse(localStorage.getItem("odin-nav-closed") || "[]"); } catch (e) {}
  const apply = (g, on) => {
    g.classList.toggle("closed", on);
    for (let el = g.nextElementSibling; el && el.classList.contains("nav") && !el.classList.contains("solo"); el = el.nextElementSibling)
      el.classList.toggle("hid", on);
  };
  document.querySelectorAll(".nav-group").forEach(g => {
    const name = g.textContent.trim();
    apply(g, closed.includes(name));
    g.addEventListener("click", () => {
      const on = !g.classList.contains("closed");
      apply(g, on);
      const i = closed.indexOf(name);
      if (on && i < 0) closed.push(name); else if (!on && i >= 0) closed.splice(i, 1);
      try { localStorage.setItem("odin-nav-closed", JSON.stringify(closed)); } catch (e) {}
    });
  });
})();
</script>
<script>
/* 앱 껍데기(index.html) 안에서 열렸으면 지금 위치·제목을 알린다 — 새로고침해도 이 화면·날짜로 돌아오게 */
(function () {
  if (window.parent === window) return;
  let last = "";
  const tell = () => {
    const screen = location.pathname.split("/").pop() + location.search;
    if (screen === last) return;
    last = screen;
    window.parent.postMessage({ type: "odin-screen", screen, title: document.title }, "*");
  };
  tell();
  setInterval(tell, 500);   // 탭·날짜 전환은 history.replaceState라 load 이벤트가 없어 짧게 확인
})();
</script>
